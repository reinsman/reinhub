{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "examplesrv.configSecretName" . }}
  labels:
    {{- include "examplesrv.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.secretKey }}: |
    listen = {{ .Values.config.listen | quote }}
    loglv = {{ .Values.config.logLevel | quote }}
    key = {{ .Values.config.jwtKey | quote }}

    [database]
    db = {{ .Values.config.database.name | quote }}
    user = {{ .Values.config.database.user | quote }}
    password = {{ .Values.config.database.password | quote }}
    endpoint = {{ .Values.config.database.endpoint | quote }}
{{- end }}
